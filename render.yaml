# ==============================================================
# render.yaml – Render Blueprint (https://render.com/docs/blueprint-spec)
# ==============================================================
services:
  - type: web
    name: iacoran-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter            # ~400 MB RAM used now (was several GB with PyTorch)
    region: frankfurt        # EU region closest to West Africa
    healthCheckPath: /api/health/
    envVars:
      # ---- Django ----
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      # - key: CORS_ALLOWED_ORIGINS   # e.g. https://corangpt.onrender.com
      #   value: ""

      # ---- Superuser (created only if the password is set) ----
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@iacoran.com
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

      # ---- Free LLM providers (tried in this order, at least one key needed) ----
      - key: GEMINI_API_KEY       # https://aistudio.google.com/apikey
        sync: false
      - key: GROQ_API_KEY         # https://console.groq.com/keys (fallback)
        sync: false
      - key: CEREBRAS_API_KEY     # https://cloud.cerebras.ai (optional 2nd fallback)
        sync: false

      # ---- Database (Render PostgreSQL) ----
      - key: DATABASE_URL
        fromDatabase:
          name: iacoran-db
          property: connectionString

      # ---- Server sizing ----
      - key: WEB_CONCURRENCY      # 1 process = model loaded once
        value: "1"
      - key: GUNICORN_THREADS
        value: "8"
      - key: EMBEDDING_THREADS    # matches the fractional CPU of small plans
        value: "1"

databases:
  - name: iacoran-db
    plan: starter
    databaseName: iacoran
    user: iacoran_user
    region: frankfurt
